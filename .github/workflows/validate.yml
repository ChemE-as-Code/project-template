name: validate
on: [pull_request, push]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install git+https://github.com/ChemE-as-Code/core.git
      - run: cheme fmt --check
      - run: cheme validate
      # Stage gates report progress (e.g. no design review recorded yet); they do not fail the build.
      - name: Engineering-step gates (informational)
        run: cheme check --no-write
        continue-on-error: true
