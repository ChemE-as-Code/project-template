name: validate
on: [pull_request, push]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # plantcode and pyDEXPI are private while in development: read-only deploy keys on each,
      # private halves in the secrets DEPLOY_KEY_PLANTCODE and DEPLOY_KEY_PYDEXPI.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.DEPLOY_KEY_PLANTCODE }}
            ${{ secrets.DEPLOY_KEY_PYDEXPI }}
      - run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install git+https://github.com/ChemE-as-Code/plantcode.git
      - run: plantcode fmt --check
      - run: plantcode validate
      # Stage gates report progress (e.g. no design review recorded yet); they do not fail the build.
      - name: Engineering-step gates (informational)
        run: plantcode check --no-write
        continue-on-error: true
