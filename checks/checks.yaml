# Engineering-step gates. Schema: `cheme schema checks`. Run: `cheme check`.
schema: cheme/checks/v1
checks:
  - id: design-basis
    title: Design basis exists
    stage: concept
    kind: files
    files: [process/design-basis.yaml]
  - id: concept-lists
    title: Design decisions and the equipment, line and instrument lists exist
    stage: concept
    kind: files
    files: [DESIGN.md, equipment/equipment-list.yaml, piping/line-list.yaml, control/instrument-list.yaml]
  # Once plant.yaml declares the BFD ({id: BFD, kind: bfd}), add process/BFD.xml to files.
  - id: process-concept
    title: Materials and flowsheet exist (the BFD is generated by cheme process build)
    stage: concept
    kind: files
    files: [process/materials.yaml, process/flowsheet.yaml]
  - id: process-balances
    title: Every block balance is evaluable and clean, the BFD current
    stage: concept
    kind: validate
    fail_on: info
    rules: [cheme.process-balance*, cheme.process-schema, cheme.generated-*]
  # Links from blocks, steps and streams to equipment, lines, instruments and sheets: reported
  # at concept, required at basic.
  - id: process-links-concept
    title: Process links resolve (reported only)
    stage: concept
    kind: process-links
    level: warning
  # The concept gate accepts cheme.process-component-balance-not-evaluable (a component
  # balance without compositions); the basic gate requires component balances.
  - id: process-basic
    title: PFD generated for the design case, process rules clean, no stale calculated values
    stage: basic
    kind: validate
    generated: [pfd]                # fails until plant.yaml declares a kind: pfd sheet, built
    fail_on: info
    rules: [cheme.process-refine-pending, cheme.process-balance*,
            cheme.process-component-balance*, cheme.process-calculated-stale,
            cheme.generated-*]
  - id: process-links
    title: Every process link resolves against the lists and sheets
    stage: basic
    kind: process-links
    level: error
  - id: assumptions-marked
    title: Assumed values are marked ASSUMED in the design basis
    stage: concept
    kind: command
    command: grep -q ASSUMED process/design-basis.yaml
  # kind: validate fails on errors. `fail_on: warning` (or info) makes warnings fail too, `rules`
  # limits it to some rule ids (* matches any text), and `accept` lists findings the gate lets
  # pass, each by the id `cheme validate --json` gives it and with a reason (who, why).
  - id: pids-valid
    title: Every P&ID and list validates
    stage: basic
    kind: validate
  - id: drawing-clean
    title: No line through a label or valve, along a pipe or slanted, no crossing, overlapping or
      misplaced label, no off-page connector off the sheet's edge left unaccepted
    stage: basic
    kind: validate
    # info: cheme.line-not-orthogonal (a slanted line) is an info finding
    fail_on: info
    rules: [cheme.line-through-label, cheme.line-crossing, cheme.label-overlap,
            cheme.label-far-from-owner, cheme.line-through-valve, cheme.line-on-pipe,
            cheme.line-not-orthogonal, cheme.offpage-not-on-edge]
    # A sheet kept from the DEXPI reference P&ID (pyDEXPI's sample, e.g. as a worked example)
    # fails this gate by design: the reference has crossings and labels on its lines. Accept
    # its findings here, naming the sheet:
    #   accept:
    #     - {id: "pid/P-01.xml#*", reason: "DEXPI reference sheet, kept as drawn by DEXPI"}
    # Other findings are accepted one by one, by the id `cheme validate --json` gives them:
    # accept:
    #   - id: "pid/P-03.xml#line-crossing:Line_GOX3001_S1_P1+Line_LOX3001_S1_P1"
    #     reason: "D-023: no route around the GOX riser; J. Smith, design review 2026-10-20"
    # A crossing a connector's move to the sheet's edge adds is accepted the same way (the
    # connector goes on the edge even so), and so is a utility stub kept at its user:
    #   - id: "pid/P-04.xml#offpage-not-on-edge:OPC_CW4001"
    #     reason: "CW stub drawn at E-4102 by convention; plant owner, 2026-11-05"
  - id: pids-exist
    title: At least one P&ID sheet
    stage: basic
    kind: files
    files: ["pid/*.xml"]
  - id: design-review
    title: A current, independent design review is recorded
    stage: basic
    kind: review                   # a record with front matter (reviews/README.md)
    topic: design
    require_kind: [human, agent]    # an author's self review does not pass
  # The 3D layout (layout/, skills layout-yaml, pipe-routing, structures-access,
  # area-classification, review). A kind: layout-model gate checks the layout files and the
  # generated layout/plant-model.yaml against each item of require (`cheme schema checks`).
  - id: layout-plot-plan
    title: Plot plan - site, areas, roads, racks, every item placed, separations declared
    stage: concept
    kind: layout-model
    require: [site, areas, roads, racks, placed, separations]
  - id: layout-3d
    title: 3D model current, nozzles resolved, elevated items mounted, process lines routed or skipped, no clashes, zones declared, plan and sections reviewed
    stage: basic
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes, zones, drawings]
    min_dn: 25                      # smaller lines are field-run at basic engineering
    # utilities are routed at detail engineering (gate layout-detail)
    exclude_fluids: [Cooling water, Cooling water return, Chilled water, Instrument air,
                     Plant air, Utility nitrogen, Steam, Condensate]
    sections: 2                     # the layout review cites the plot plan and two sections
    # A clash or headroom finding that stays is accepted here with a reason, by its id:
    # accept:
    #   - id: "layout/plant-model.yaml#layout-clash-pipe:P-01/Line_A_S1+P-01/Line_B_S1"
    #     reason: "insulated lines touch at the support only; J. Smith, layout review 2026-11-02"
  # The lifting study (cheme layout lifting, skill structures-access): every heavy item
  # (5 t or more, ASSUMED) has its crane, a clear lane and a laydown; with crane load charts in
  # layout/crane-chart.yaml, a chart that carries each lift. The study is written and current.
  - id: lifting-study
    title: Lifting study - every heavy item has a crane, a clear lane and a laydown
    stage: basic
    kind: layout-model
    require: [model-current, lifting, lifting-current]
  # The material take-off of the 3D model (estimate/, skill mto-estimate): rewritten after the
  # model's last change. Add rates (the project's own, not the example) and estimate-current
  # once the project prices it.
  - id: mto
    title: Material take-off current with the 3D model
    stage: basic
    kind: mto
    require: [mto-current]
  # The LCA of the operation (lca/): once lca/lca.yaml exists, uncomment; add factors once the
  # project's own replace the example.
  # - id: lca
  #   title: LCA mapped and current with the flowsheet
  #   stage: basic
  #   kind: lca
  #   require: [mapped, lca-current]
  # The techno-economic analysis (estimate/tea.yaml, skill tea): once the project prices its
  # plant, uncomment; add class-stage (the estimate class the stage expects) and decision (the
  # baseline meets the decision's threshold) before the stage's investment decision.
  # - id: tea
  #   title: TEA priced, of the project's own premises, and current
  #   stage: basic
  #   kind: tea
  #   require: [prices, no-example, tea-current]
  # Calculation maturity (cheme maturity, docs/framework/maturity.md): the level the evidence
  # supports reaches require (one of sourced, balanced, predictive, engineering); max_claim also
  # fails when process.yaml claims more than that. Engineering runs the whole validation (slow
  # on a large plant); a lower level skips it. Uncomment once the design basis is written.
  # - id: maturity-balanced
  #   title: The conceptual PFD is sourced and balanced
  #   stage: basic
  #   kind: maturity
  #   require: [balanced]
  #   max_claim: true
  - id: layout-review
    title: A current, independent layout review is recorded
    stage: basic
    kind: review
    topic: layout
    require_kind: [human, agent]
  - id: layout-detail
    title: Every line routed, including utilities and small bore, no clashes
    stage: detail
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes]
    min_dn: 0
  # Cables and trays (electrical/, skill electrical-cabling): every motor and instrument has a
  # cable routed in trays, no tray over its fill, power and instrument trays apart.
  - id: electrical
    title: A cable to every motor and instrument, routed in trays, fill and separation kept
    stage: detail
    kind: layout-model
    require: [model-current, cables, trays]
  # Ventilation (layout/hvac.yaml, skill hvac-ducts): every clad building ventilated, ducts
  # routed inside it within their velocity limits, units and louvres large enough.
  - id: hvac
    title: Clad buildings ventilated, ducts routed within their velocity limits
    stage: detail
    kind: layout-model
    require: [model-current, hvac]
  # Control records (control/loops.yaml, control/sequences.yaml, process/narrative.md,
  # control/philosophy.md; skills control-loops, control-sequences, control-narrative): at
  # concept and basic a draft may have gaps (cheme.control-incomplete and -unresolved are info);
  # at detail every loop and sequence is complete and every reference resolves. A plant without
  # control records passes. Left out on purpose: logic given as text, a loop sharing a tag with
  # an interlock, an alarm at a trip level (each to be judged, not removed) and a changed basis
  # (cheme.control-stale); a file that fails its schema is the pids-valid gate's.
  - id: control-complete
    title: Loops and sequences complete, every control reference resolved
    stage: detail
    kind: validate
    fail_on: info
    rules: [cheme.control-incomplete, cheme.control-unresolved, cheme.control-ref,
            cheme.control-unknown-tag, cheme.control-conflict, cheme.control-unit,
            cheme.control-case, cheme.control-cycle, cheme.control-duplicate,
            cheme.control-document, cheme.control-unreachable]
  - id: datasheets
    title: A datasheet for every equipment-list item
    stage: detail
    kind: datasheets               # equipment/datasheets/<TAG>.yaml, see its README
    # require: [dimensions, weights, nozzle-schedule, drawing-current]  # main dimensions,
    #   weights, a located nozzle schedule and current outline drawings (<TAG>.svg)
  # Prefer on-sheet over grep for what a P&ID must show: it finds printed tags in the model.
  # - id: relief-on-pid
  #   title: Relief devices drawn and connected
  #   stage: basic
  #   kind: on-sheet
  #   sheets: [P-01]            # or sheet: P-01; omitted: any sheet
  #   tags: [PSV-101]           # equipment, instrument (PICSA-101), valve or line tags
  #   classes: [SafetyValve]    # at least min_count (1) of each class
  #   connected: true           # piped, on a segment, with a measuring/signal line

  # Open items (plant.yaml issues:): every action, engineering hold, technical query and design
  # change labelled gate:<stage> (or an earlier stage) is closed out before the stage is signed
  # off, as an action tracker. n/a until plant.yaml declares issues; without a GitHub token the
  # gate fails as "not evaluated", it never passes unseen.
  - id: issues-concept
    title: No open item to close before the concept gate
    stage: concept
    kind: issues
  - id: issues-basic
    title: No open item to close before the basic engineering gate
    stage: basic
    kind: issues
  - id: issues-detail
    title: No open item to close before the detail engineering gate
    stage: detail
    kind: issues

# Findings accepted for every gate and for `cheme validate`, which then reports them as info
# with the reason (an entry that names no finding is reported as cheme.accept-unused).
# Only warnings and infos can be accepted; an error stays an error (cheme.accept-error).
accept: []
